<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RemoteDesk · 控制中心</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="brand">RD</span><div><h1>RemoteDesk 控制中心</h1><p>设备在线状态与连接记录</p></div><span class="badge">v0.1 工程增量</span></header><section class="login"><label for="token">管理令牌</label><input id="token" type="password" autocomplete="off" placeholder="填写部署目录中的 admin.token"><button id="connect">连接后台</button><button id="logout">清除令牌</button><p id="message" role="status">令牌仅保存在当前页面内存，不写入本地存储。</p></section><section class="cards"><article><small>注册设备</small><strong id="total">—</strong></article><article><small>在线设备</small><strong id="online">—</strong></article><article><small>活动中继</small><strong id="relay">—</strong></article></section><section><h2>设备</h2><div class="scroll"><table><thead><tr><th>设备名称</th><th>设备 ID</th><th>状态</th><th>最后心跳</th></tr></thead><tbody id="devices"></tbody></table></div></section><section><h2>会话</h2><div class="scroll"><table><thead><tr><th>类型</th><th>来源 → 目标</th><th>状态</th></tr></thead><tbody id="sessions"></tbody></table></div></section><footer>当前只读管理页。UDP 可达探测不等于已完成 QUIC 远程桌面；画面与性能指标尚未接入。</footer></main><script src="/app.js"></script></body></html>
