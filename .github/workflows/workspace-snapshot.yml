name: Engineering workspace snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/workspace-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source only
        run: git archive --format=zip --output=workspace.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-internal
          path: workspace.zip
          retention-days: 1
          if-no-files-found: error
