name: Two product packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['cmd/**', 'cmake/**', 'apps/**', 'internal/**', 'native/**', 'crates/**', 'scripts/**', 'installer/**', '.github/workflows/release.yml']
permissions:
  contents: read
concurrency:
  group: products-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    if: "github.event.head_commit.message != 'chore: stage verified UI source'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/release/build-server.sh
      - run: go test -race -count=1 ./...
      - name: Verify embedded Admin in a real browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          python3 scripts/release/smoke-admin.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-Server
          path: release/RemoteDesk-Server-linux-amd64.tar.gz
          if-no-files-found: error
  client:
    if: "github.event.head_commit.message != 'chore: stage verified UI source'"
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Install Qt SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtwebengine qtwebchannel qtpositioning
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: rd-vcpkg-release-x64-v1-${{ hashFiles('vcpkg.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rd-rust-ui-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/src/**') }}
          restore-keys: rd-rust-ui-${{ runner.os }}-
      - name: Build integrated client installer
        shell: pwsh
        run: ./scripts/build-full-windows.ps1 -Installer
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: rd-vcpkg-release-x64-v1-${{ hashFiles('vcpkg.json') }}
      - name: Include installation verification inside the client artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/verification | Out-Null
          Get-ChildItem build/client-package -Directory | ForEach-Object { Copy-Item "$($_.FullName)/docs/client-ui-verification/*" release/verification -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-Client
          path: |
            release/RemoteDeskSetup.exe
            release/verification/
          if-no-files-found: error
  publish:
    needs: [server, client]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RemoteDesk-*
          path: release
          merge-multiple: true
      - run: python3 scripts/release/verify-release.py release
      - name: Publish exactly two products
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/RemoteDesk-Server-linux-amd64.tar.gz release/RemoteDeskSetup.exe --verify-tag --title "RemoteDesk $TAG" --notes-file docs/TWO_PACKAGES.md --prerelease
