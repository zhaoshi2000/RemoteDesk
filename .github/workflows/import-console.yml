name: Apply verified console integration
on:
  push:
    branches: [main]
    paths: ['.delivery/console-manifest.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    if: github.repository == 'zhaoshi2000/RemoteDesk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source hashes and apply reviewed edits
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          manifest = json.loads((root / '.delivery/console-manifest.json').read_text())
          expected = {'format':'xz-edits-v1','sha256':'20ab4068d28cea542daafbdd2aaa1950e0b5ea1bafd74680afc03ca55119b8b4','decoded_bytes':119302,'files':37,'chunks':7}
          if manifest != expected:
              raise SystemExit('unexpected source manifest')
          encoded = ''.join((root / f'.delivery/console-part-{i:02d}.b64').read_text(encoding='ascii') for i in range(7))
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != expected['sha256']:
              raise SystemExit('source archive hash mismatch')
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(packed, max_length=1024*1024)
          if not decoder.eof or decoder.unused_data or len(raw) != expected['decoded_bytes']:
              raise SystemExit('invalid source bounds')
          edits = json.loads(raw)
          if not isinstance(edits, dict) or len(edits) != 37:
              raise SystemExit('invalid file count')
          checked = []
          for name, item in edits.items():
              p = pathlib.PurePosixPath(name)
              if not name or p.is_absolute() or '\\' in name or ':' in name or '..' in p.parts or any(x in ('.git','.github','.delivery') for x in p.parts) or str(p) != name:
                  raise SystemExit('unsafe source path')
              target = root.joinpath(*p.parts)
              if any(x.is_symlink() for x in [target, *target.parents]) or not target.resolve().is_relative_to(root):
                  raise SystemExit('unsafe destination')
              if set(item) != {'base','edits','sha256','executable'} or not isinstance(item['executable'], bool):
                  raise SystemExit('invalid source entry')
              before = target.read_bytes() if target.exists() else b''
              digest = hashlib.sha256(before).hexdigest() if target.exists() else None
              if digest != item['base']:
                  raise SystemExit(f'base changed: {name}')
              lines = before.decode('utf-8').splitlines(True)
              cursor = 0
              for edit in item['edits']:
                  if not isinstance(edit, list) or len(edit) != 3:
                      raise SystemExit('invalid edit')
                  a,b,text = edit
                  if not isinstance(a,int) or not isinstance(b,int) or not isinstance(text,str) or not cursor <= a <= b <= len(lines):
                      raise SystemExit('invalid edit range')
                  cursor = b
              for a,b,text in reversed(item['edits']):
                  lines[a:b] = [text]
              content = ''.join(lines).encode('utf-8')
              if hashlib.sha256(content).hexdigest() != item['sha256']:
                  raise SystemExit(f'edited content hash mismatch: {name}')
              checked.append((name,target,content,item['executable']))
          for name,target,content,executable in checked:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(content)
              target.chmod(0o755 if executable else 0o644)
          subprocess.run(['git','add','--',*[x[0] for x in checked]],check=True)
          subprocess.run(['git','rm','-r','--','.delivery'],check=True)
          print(f'Verified all {len(checked)} base and result hashes')
          PY
      - name: Commit source and start two-product build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrated Vue Admin, live server monitoring and two-product delivery'
          git push origin HEAD:main
          git rev-parse HEAD
          gh workflow run release.yml --ref main
