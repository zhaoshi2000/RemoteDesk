name: Prepare source integration (temporary)
on:
  push:
    paths: ['.github/workflows/prepare-integration.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: integration-source-temporary
          path: source.zip
          retention-days: 1
          if-no-files-found: error
