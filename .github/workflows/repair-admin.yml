name: Verify Admin editing repair
on:
  push:
    branches: [main]
    paths: ['.maintenance/admin-fix.json']
permissions:
  contents: write
jobs:
  server:
    if: github.repository == 'zhaoshi2000/RemoteDesk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source repair with before/after verification
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          edits=json.loads(pathlib.Path('.maintenance/admin-fix.json').read_text())
          expected={'apps/admin/src/App.vue','apps/admin/package.json','scripts/release/build-server.sh'}
          if set(edits)!=expected: raise SystemExit('Unexpected repair files')
          results=[]
          for name,spec in edits.items():
              p=pathlib.Path(name)
              if p.is_symlink(): raise SystemExit('Symlink rejected')
              raw=p.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=spec['base']: raise SystemExit('Source changed: '+name)
              lines=raw.decode('utf-8').splitlines(True)
              cursor=0
              for a,b,text in spec['edits']:
                  if not cursor<=a<=b<=len(lines) or not isinstance(text,str): raise SystemExit('Invalid edit')
                  cursor=b
              for a,b,text in reversed(spec['edits']): lines[a:b]=[text]
              result=''.join(lines).encode('utf-8')
              if hashlib.sha256(result).hexdigest()!=spec['result']: raise SystemExit('Result hash mismatch: '+name)
              results.append((p,result))
          for p,result in results: p.write_bytes(result)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','rm','--','.maintenance/admin-fix.json','.github/workflows/repair-admin.yml'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(admin): reject stale form responses and update supported Vite tooling'
          git push origin HEAD:main
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/release/build-server.sh
      - run: go test -race -count=1 ./...
      - name: Verify compiled Admin in Chromium
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          python3 scripts/release/smoke-admin.py
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-Server
          path: release/RemoteDesk-Server-linux-amd64.tar.gz
          if-no-files-found: error
