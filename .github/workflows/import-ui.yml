name: Apply verified UI and inventory implementation
on:
  push:
    branches: [main]
    paths: ['.delivery-ui/manifest.json']
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    if: github.repository == 'zhaoshi2000/RemoteDesk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source changes before applying
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd().resolve()
          expected={'format':'rd-ui-delta-v2','files':35,'raw_bytes':98713,'packed_sha256':'e8fcd453cdec03f28f18e2c6e0c0c7d72564364939768c96eab9c3cc0f4593e8','chunks':6}
          manifest=json.loads((root/'.delivery-ui/manifest.json').read_text())
          if manifest!=expected: raise SystemExit('Unexpected manifest')
          encoded=''.join((root/f'.delivery-ui/part-{i:02d}.b64').read_text(encoding='ascii') for i in range(6))
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!=expected['packed_sha256']: raise SystemExit('Archive integrity mismatch')
          d=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=d.decompress(packed,max_length=2*1024*1024)
          if not d.eof or d.unused_data or len(raw)!=98713: raise SystemExit('Invalid archive bounds')
          files=json.loads(raw)
          if not isinstance(files,dict) or len(files)!=35: raise SystemExit('Invalid file count')
          checked=[]
          for name,item in files.items():
           p=pathlib.PurePosixPath(name)
           if p.is_absolute() or '\\' in name or ':' in name or '..' in p.parts or any(x in ('.git','.github','.delivery-ui') for x in p.parts) or str(p)!=name: raise SystemExit('Unsafe path')
           target=root.joinpath(*p.parts)
           if any(x.is_symlink() for x in (target,*target.parents)) or not target.resolve().is_relative_to(root): raise SystemExit('Symlink or escaped path')
           if set(item)!={'before','sha256','edits'}: raise SystemExit('Invalid entry')
           if item['before'] is None:
            if target.exists(): raise SystemExit('New path exists: '+name)
            original=b''
           else:
            original=target.read_bytes()
            if hashlib.sha256(original).hexdigest()!=item['before']: raise SystemExit('Source changed: '+name)
           lines=original.decode('utf-8').splitlines(keepends=True)
           previous=0
           for start,end,replacement in item['edits']:
            if type(start)!=int or type(end)!=int or not previous<=start<=end<=len(lines) or not isinstance(replacement,list) or not all(isinstance(x,str) for x in replacement): raise SystemExit('Invalid edit')
            previous=end
           for start,end,replacement in reversed(item['edits']): lines[start:end]=replacement
           result=''.join(lines).encode('utf-8')
           if hashlib.sha256(result).hexdigest()!=item['sha256']: raise SystemExit('Result mismatch: '+name)
           checked.append((name,target,result))
          for name,target,result in checked:
           target.parent.mkdir(parents=True,exist_ok=True)
           target.write_bytes(result)
          subprocess.run(['git','add','--',*[name for name,_,_ in checked]],check=True)
          subprocess.run(['git','rm','-r','--','.delivery-ui'],check=True)
          print('Verified and applied 35 source files. No credentials or build binaries included.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: deliver Windows UI and authenticated hardware inventory with installed-app verification'
          git push origin HEAD:main
          git rev-parse HEAD
      - name: Build the two integrated products
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
