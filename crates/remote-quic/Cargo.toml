[package]
name = "remote-quic"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.35", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2.0"
tokio = { version = "1.47.1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
x509-parser = { version = "0.18.0", features = ["verify"] }
zeroize = "1.8.2"

[dev-dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["ring", "pem", "crypto"] }
